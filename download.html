<!DOCTYPE html>

    <style>
        body {

        header {

        .header-flex {

        main {

        .terminal-panel {

        .category-label {

            color: #c4c4cc;

            padding: 4px 10px;

            display: inline-block;

        h2 {

            font-weight: 800;
            color: #ffffff;
            margin: 16px 0 8px 0;
            letter-spacing: -0.5px;
        }
        .sub-annotation {
            font-size: 13px;
            color: #8d8d99;
            margin: 0 0 24px 0;
        }
        hr {
            border: 0;
            border-top: 1px solid #29292e;
            margin: 24px 0;
        }
        /* 📊 Standardized Advertisement Panel */
        .ad-banner-slot {
            width: 100%;
            min-height: 90px;
            background-color: #121214;
            border: 1px dashed #29292e;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }
        .ad-placeholder-text {
            font-size: 11px;
            color: #52525b;
            font-family: monospace;
        }
        /* Countdown Layout */
        .countdown-wrapper {
            margin: 32px 0;
        }
        .countdown-instruction {
            font-size: 14px;
            color: #c4c4cc;
        }
        .numeric-timer {
            font-size: 64px;
            font-weight: 800;
            color: #00b37e;
            margin: 8px 0;
        }
        /* Master Access Button */
        .gate-access-button {
            display: none;
            background-color: #00b37e;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            padding: 16px 32px;
            border-radius: 4px;
            text-decoration: none;
            transition: background-color 0.15s ease;
            margin: 24px 0;
        }
        .gate-access-button:hover {
            background-color: #00875f;
        }
        .system-footer-note {
            font-size: 11px;
            color: #7c7c8a;
            margin-top: 12px;

    <script src="data.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const modId = urlParams.get('mod');
        const activeMod = beamMods.find(m => m.id === modId);

        if (activeMod) {
            document.getElementById('mod-title').textContent = activeMod.name;
            document.getElementById('mod-cat').textContent = activeMod.category;
            document.getElementById('download-link').href = activeMod.qiwiLink;

            let timeLeft = 5;
            const timerElement = document.getElementById('timer');
            const cooldownArea = document.getElementById('cooldown-area');
            const downloadButton = document.getElementById('download-link');

            const countdownInterval = setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    cooldownArea.style.display = 'none'; 
                    downloadButton.style.display = 'inline-block'; 
                }
            }, 1000);
        } else {
            document.getElementById('mod-title').textContent = "Asset Registry Entry Invalid";
        }
    </script>
