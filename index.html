<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beamdex</title>
    <style>
        body {
            background-color: #0b0f17;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
            padding: 16px;
        }
        .header-wrap {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header a {
            text-decoration: none;
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.05em;
        }
        header span {
            color: #f97316;
        }
        .badge-status {
            font-size: 12px;
            color: #34d399;
            background-color: rgba(6, 78, 59, 0.4);
            border: 1px solid #064e3b;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        main {
            flex-grow: 1;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }
        .ad-top {
            width: 100%;
            background-color: #111827;
            border: 1px solid #1f2937;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .ad-label {
            font-size: 11px;
            color: #4b5563;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .grid-home {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .grid-download {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }
        @media (min-width: 768px) {
            .grid-home { grid-template-columns: 1fr 1fr; }
            .grid-download { grid-template-columns: 2fr 1fr; }
        }
        .heading-txt {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 16px;
        }
        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 16px;
            box-sizing: border-box;
        }
        .home-card {
            display: flex;
            gap: 16px;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s;
        }
        .home-card:hover {
            border-color: rgba(249, 115, 22, 0.5);
        }
        .card-thumb {
            width: 90px;
            height: 90px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid #1f2937;
            flex-shrink: 0;
        }
        .card-meta {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .badge-cat {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
            color: #fb923c;
            background-color: rgba(124, 45, 18, 0.4);
            padding: 2px 8px;
            border-radius: 4px;
            width: max-content;
        }
        .card-name {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            margin: 6px 0 0 0;
        }
        .home-card:hover .card-name {
            color: #fb923c;
        }
        .card-size {
            font-size: 12px;
            color: #9ca3af;
        }
        .dl-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .dl-main-img {
            width: 100%;
            height: auto;
            max-height: 380px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #1f2937;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .btn-box {
            text-align: center;
        }
        .btn-box h3 {
            font-size: 12px;
            color: #9ca3af;
            text-transform: uppercase;
            margin: 0 0 16px 0;
            letter-spacing: 0.05em;
        }
        .action-btn {
            width: 100%;
            font-weight: bold;
            padding: 14px 0;
            border-radius: 6px;
            font-size: 13px;
            text-transform: uppercase;
            border: none;
            box-sizing: border-box;
            letter-spacing: 0.05em;
        }
        .btn-wait {
            background-color: #1f2937;
            color: #6b7280;
            cursor: not-allowed;
        }
        .btn-go {
            background-color: #059669;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-go:hover {
            background-color: #10b981;
        }
        .ad-side {
            width: 100%;
            background-color: #111827;
            border: 1px solid #1f2937;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            overflow: hidden;
        }
        .loading-screen {
            text-align: center;
            padding: 50px 0;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-wrap">
            <a href="?">BEAM<span>DEX</span></a>
            <div class="badge-status">Verified Safe</div>
        </div>
    </header>

    <main>
        <div class="ad-top">
            <!-- PASTE YOUR 728x90 A-ADS SCRIPT HERE -->
<!-- BEGIN AADS AD UNIT 2454179 -->

<div id="frame" style="width: 100%;margin: auto;position: relative; z-index: 99998;">
          <iframe data-aa='2454179' src='//acceptable.a-ads.com/2454179/?size=Adaptive'
                            style='border:0; padding:0; width:70%; height:auto; overflow:hidden;display: block;margin: auto'></iframe>
        </div>

<!-- END AADS AD UNIT 2454179 -->        </div>

        <div id="pageContent" class="loading-screen">Loading repository content...</div>
    </main>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const activeSlug = urlParams.get('mod');

        async function runSite() {
            try {
                const res = await fetch('cars.json');
                const database = await res.json();

                if (activeSlug) {
                    const match = database.find(item => item.slug === activeSlug);
                    match ? showDownloadPage(match) : window.location.href = '?';
                } else {
                    showHomepage(database);
                }
            } catch (err) {
                document.getElementById('pageContent').innerHTML = "<p style='color: #ef4444; text-align: center;'>Database fetch failed.</p>";
            }
        }

        function showHomepage(cars) {
            let layout = `<div class="heading-txt">Latest Community Vehicles</div><div class="grid-home">`;
            cars.forEach(car => {
                layout += `
                    <a href="?mod=${car.slug}" class="card home-card">
                        <img src="${car.image}" class="card-thumb" alt="Preview Thumbnail">
                        <div class="card-meta">
                            <div>
                                <span class="badge-cat">${car.category}</span>
                                <h3 class="card-name">${car.name}</h3>
                            </div>
                            <span class="card-size">${car.size}</span>
                        </div>
                    </a>`;
            });
            layout += `</div>`;
            document.getElementById('pageContent').innerHTML = layout;
        }

        function showDownloadPage(car) {
            document.title = `Download ${car.name}`;
            document.getElementById('pageContent').innerHTML = `
                <div class="grid-download">
                    <div class="card">
                        <div class="dl-header-row">
                            <span class="badge-cat">${car.category}</span>
                            <span class="card-size" style="font-family: monospace;">${car.size}</span>
                        </div>
                        <h1 class="card-name" style="font-size: 22px; margin-bottom: 16px;">${car.name}</h1>
                        <img src="${car.image}" class="dl-main-img" alt="Main Showcase Grid Render">
                    </div>
                    
                    <div class="sidebar">
                        <div class="card btn-box">
                            <h3>File Security Check</h3>
                            <button id="timerBtn" disabled class="action-btn btn-wait">Preparing Route (5s)</button>
                        </div>
                        
                        <div class="ad-side">
                            <!-- PASTE YOUR 300x250 A-ADS SCRIPT HERE -->
                            <span class="ad-label">[ Sidebar Ad Box ]</span>
                        </div>
                    </div>
                </div>`;

            let timerSeconds = 5;
            const targetButton = document.getElementById('timerBtn');
            const countdownTracker = setInterval(() => {
                timerSeconds--;
                if (timerSeconds > 0) {
                    targetButton.innerText = `Preparing Route (${timerSeconds}s)`;
                } else {
                    clearInterval(countdownTracker);
                    targetButton.disabled = false;
                    targetButton.className = "action-btn btn-go";
                    targetButton.innerText = "🚀 Access Download Now";
                    targetButton.onclick = () => window.location.href = car.downloadUrl;
                }
            }, 1000);
        }

        runSite();
    </script>
</body>
</html>
