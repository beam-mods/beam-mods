<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeamDex - Professional Simulator Asset Registry</title>
    <style>
        /* Corporate Storefront Theme */
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: #1a1a1e;
            border-bottom: 1px solid #29292e;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-text {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
        }
        .logo-subtext {
            font-size: 12px;
            color: #8d8d99;
            font-weight: 400;
        }
        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 24px;
        }
        /* 📊 Standardized Advertisement Panel */
        .ad-banner-slot {
            width: 100%;
            min-height: 90px;
            background-color: #1a1a1e;
            border: 1px solid #29292e;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 32px;
        }
        .ad-placeholder-text {
            font-size: 11px;
            color: #7c7c8a;
            font-family: monospace;
            text-transform: uppercase;
        }
        /* Grid Architecture */
        .mod-matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }
        /* Clean Mod Asset Cards */
        .asset-card {
            background-color: #1a1a1e;
            border: 1px solid #29292e;
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }
        .asset-card:hover {
            border-color: #00b37e;
            transform: translateY(-2px);
        }
        .asset-visual-container {
            height: 140px;
            background-color: #202024;
            border-bottom: 1px solid #29292e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            position: relative;
        }
        .asset-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: #29292e;
            border: 1px solid #323238;
            color: #c4c4cc;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .asset-body {
            padding: 20px;
        }
        .asset-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 8px 0;
        }
        .asset-summary {
            font-size: 13px;
            color: #8d8d99;
            margin: 0 0 20px 0;
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .asset-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #29292e;
            padding-top: 16px;
        }
        .asset-data-size {
            font-size: 12px;
            color: #7c7c8a;
            font-family: monospace;
        }
        .asset-action-link {
            background-color: #00b37e;
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.15s ease;
        }
        .asset-action-link:hover {
            background-color: #00875f;
        }
        footer {
            text-align: center;
            padding: 40px 24px;
            font-size: 12px;
            color: #7c7c8a;
            border-top: 1px solid #29292e;
            margin-top: 64px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">BEAMDEX <span style="font-weight: 300; color: #8d8d99;">| REGISTRY</span></div>
        <div class="logo-subtext">Verified Simulator Asset Directory</div>
    </header>

    <main>
        <!-- 📊 TOP MONETIZATION SLOT (Paste your horizontal A-Ads iframe here) -->
        <div class="ad-banner-slot">
<!-- 📊 TOP MONETIZATION SLOT (Paste your horizontal A-Ads iframe here) -->
<div class="ad-banner-slot">
    <p class="ad-placeholder-text">Advertisement Matrix Unit (728x90)</p>
</div>
        </div>

        <!-- Master Registry Container -->
        <div id="mod-grid" class="mod-matrix-grid"></div>
    </main>

    <footer>
        <p>© 2026 BeamDex Platform. All asset records are managed via decentralized node validation structures.</p>
    </footer>

    <script src="data.js"></script>
    <script>
        const grid = document.getElementById('mod-grid');
        beamMods.forEach(mod => {
            grid.innerHTML += `
                <div class="asset-card">
                    <div class="asset-visual-container">
                        <span>${mod.emoji}</span>
                        <span class="asset-badge">${mod.category}</span>
                    </div>
                    <div class="asset-body">
                        <h3 class="asset-title">${mod.name}</h3>
                        <p class="asset-summary">${mod.description}</p>
                        <div class="asset-meta-row">
                            <span class="asset-data-size">FILE SIZE: ${mod.size}</span>
                            <a href="download.html?mod=${mod.id}" class="asset-action-link">Access File</a>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
