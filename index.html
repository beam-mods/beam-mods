<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeamDex - Premium Physics Index</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased">

    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">⚡</span>
                <span class="text-xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400">BEAMDEX</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <!-- 📊 A-ADS HEADER SLOT -->
        <div class="w-full flex justify-center mb-8 p-2 bg-gray-900 border border-dashed border-gray-800 rounded-xl min-h-[90px]">
            <p class="text-xs text-gray-600 self-center">A-Ads Banner Placement (728x90)</p>
        </div>

        <div id="mod-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <footer class="max-w-6xl mx-auto px-4 py-12 mt-12 border-t border-gray-900 text-center text-xs text-gray-500">
        <p>© 2026 BeamDex Project. All rights reserved.</p>
    </footer>

    <script src="data.js"></script>
    <script>
        const grid = document.getElementById('mod-grid');
        beamMods.forEach(mod => {
            grid.innerHTML += `
                <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-xl hover:border-emerald-500/50 transition-all duration-300 group">
                    <div class="h-48 bg-gradient-to-br from-gray-800 to-gray-700 relative flex items-center justify-center">
                        <span class="text-4xl opacity-40 group-hover:scale-110 transition duration-300">\${mod.emoji}</span>
                        <span class="absolute top-3 left-3 bg-emerald-500/20 text-emerald-400 text-[10px] font-extrabold px-2 py-1 rounded-md uppercase tracking-wider">\${mod.category}</span>
                    </div>
                    <div class="p-5">
                        <h3 class="text-lg font-bold text-white group-hover:text-emerald-400 transition">\${mod.name}</h3>
                        <p class="text-gray-400 text-xs mt-2 line-clamp-2">\${mod.description}</p>
                        <div class="mt-5 flex justify-between items-center">
                            <span class="text-[11px] text-gray-500 font-mono">Size: \${mod.size}</span>
                            <a href="download.html?mod=\${mod.id}" class="bg-gray-800 hover:bg-emerald-500 border border-gray-700 hover:border-emerald-500 hover:text-gray-950 px-4 py-2 rounded-xl text-xs font-bold transition-all">
                                View File →
                            </a>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
