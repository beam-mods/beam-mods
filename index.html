<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeamDex - Premium Physics Index</title>
    <style>
        /* Base Styling & Dark Layout */
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }
        header {
            background-color: #111827;
            border-b: 1px solid #1f2937;
            padding: 20px;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #10b981;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }
        main {
            max-w: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        /* 📊 Ad Box Container */
        .ad-container {
            width: 100%;
            min-height: 90px;
            background-color: #111827;
            border: 1px dashed #374151;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }
        .ad-text {
            font-size: 11px;
            color: #4b5563;
        }
        /* Grid Layout for Mod Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }
        /* Mod Cards Design */
        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        .card:hover {
            border-color: #10b981;
            transform: translateY(-5px);
        }
        .card-preview {
            height: 160px;
            background: linear-gradient(135deg, #1f2937, #111827);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            position: relative;
        }
        .card-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card-content {
            padding: 24px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 10px 0;
        }
        .card-desc {
            font-size: 13px;
            color: #9ca3af;
            margin: 0 0 24px 0;
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-size {
            font-size: 12px;
            color: #6b7280;
            font-family: monospace;
        }
        .card-btn {
            background-color: #1f2937;
            color: #ffffff;
            border: 1px solid #374151;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .card-btn:hover {
            background-color: #10b981;
            border-color: #10b981;
            color: #0b0f19;
        }
        footer {
            text-align: center;
            padding: 60px 20px;
            font-size: 11px;
            color: #4b5563;
            border-top: 1px solid #111827;
            margin-top: 80px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ BEAMDEX</div>
    </header>

    <main>
        <!-- 📊 TOP AD SLOT (Paste your A-Ads horizontal iframe snippet directly over the paragraph tag below) -->
        <div class="ad-container">
            <p class="ad-text">A-Ads Leaderboard Advertisement Placement (728x90)</p>
        </div>

        <!-- Dynamic Grid Engine Container -->
        <div id="mod-grid" class="grid"></div>
    </main>

    <footer>
        <p>© 2026 BeamDex Project. All rights reserved.</p>
    </footer>

    <!-- Connect automated layout dashboard -->
    <script src="data.js"></script>
    <script>
        const grid = document.getElementById('mod-grid');
        beamMods.forEach(mod => {
            grid.innerHTML += `
                <div class="card">
                    <div class="card-preview">
                        <span>${mod.emoji}</span>
                        <span class="card-tag">${mod.category}</span>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${mod.name}</h3>
                        <p class="card-desc">${mod.description}</p>
                        <div class="card-footer">
                            <span class="card-size">Size: ${mod.size}</span>
                            <a href="download.html?mod=${mod.id}" class="card-btn">View File →</a>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
