<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeamNG Hub</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f17] text-[#e2e8f0] min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-[#111827] border-b border-[#1f2937] py-4 px-6">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="?" class="text-xl font-black text-white">BEAM<span class="text-orange-500">DRIVE</span></a>
            <span class="text-xs text-emerald-400 bg-emerald-950/50 border border-emerald-900 px-2 py-1 rounded">Safe Mods</span>
        </div>
    </header>

    <!-- Main Dynamic Content Frame -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <!-- 💰 A-ADS PLACEMENT 1 (Top Banner) -->
        <div class="w-full bg-[#111827] border border-[#1f2937] min-h-[90px] flex items-center justify-center rounded-md overflow-hidden">
            <!-- PASTE YOUR TOP A-ADS HTML CODE HERE -->
            <span class="text-xs text-gray-600">[ Top Ad Leaderboard ]</span>
        </div>

        <div id="pageContent" class="text-center py-10 text-gray-500">Loading mod repository...</div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const modSlug = params.get('mod');

        // Automatically fetch data from cars.json on page load
        async function initSite() {
            try {
                const response = await fetch('cars.json');
                const cars = await response.json();

                if (modSlug) {
                    const activeCar = cars.find(c => c.slug === modSlug);
                    activeCar ? renderDownloadPage(activeCar) : window.location.href = '?';
                } else {
                    renderHomepage(cars);
                }
            } catch (error) {
                document.getElementById('pageContent').innerHTML = "<p class='text-red-400'>Error loading data array.</p>";
            }
        }

        // 🏠 Grid Homepage View
        function renderHomepage(cars) {
            let html = `<h2 class="text-lg font-bold text-white mb-4 text-left">Latest Vehicle Repository</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
            cars.forEach(car => {
                html += `
                    <a href="?mod=${car.slug}" class="bg-[#111827] border border-[#1f2937] hover:border-orange-500/50 p-4 rounded-lg flex gap-4 transition group text-left">
                        <img src="${car.image}" class="w-24 h-24 rounded object-cover border border-[#1f2937]">
                        <div class="flex flex-col justify-between">
                            <div>
                                <span class="text-[10px] uppercase font-bold text-orange-400 bg-orange-950/40 px-2 py-0.5 rounded">${car.category}</span>
                                <h3 class="text-base font-bold text-white mt-1 group-hover:text-orange-400 transition">${car.name}</h3>
                            </div>
                            <span class="text-xs text-[#9ca3af]">${car.size}</span>
                        </div>
                    </a>`;
            });
            html += `</div>`;
            document.getElementById('pageContent').innerHTML = html;
        }

        // 📥 Countdown Download View
        function renderDownloadPage(car) {
            document.title = `Download ${car.name}`;
            document.getElementById('pageContent').innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 text-left">
                    <div class="lg:col-span-2 space-y-4">
                        <div class="bg-[#111827] border border-[#1f2937] rounded-lg p-5">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-bold text-orange-400 bg-orange-950/40 px-2 py-0.5 rounded">${car.category}</span>
                                <span class="text-xs text-[#9ca3af] font-mono">${car.size}</span>
                            </div>
                            <h1 class="text-xl font-bold text-white mb-4">${car.name}</h1>
                            <img src="${car.image}" class="w-full h-auto max-h-[350px] object-cover rounded border border-[#1f2937]">
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div class="bg-[#111827] border border-[#1f2937] rounded-lg p-5 text-center shadow-lg">
                            <button id="timerBtn" disabled class="w-full bg-[#1f2937] text-[#6b7280] font-bold py-3 rounded text-sm uppercase">Generating Route (5s)</button>
                        </div>
                        
                        <!-- 💰 A-ADS PLACEMENT 2 (Sidebar Box) -->
                        <div class="w-full bg-[#111827] border border-[#1f2937] min-h-[250px] flex items-center justify-center rounded-md overflow-hidden">
                            <!-- PASTE YOUR SIDEBAR A-ADS HTML CODE HERE -->
                            <span class="text-xs text-gray-600">[ Sidebar Ad Box ]</span>
                        </div>
                    </div>
                </div>`;

            let count = 5;
            const btn = document.getElementById('timerBtn');
            const interval = setInterval(() => {
                count--;
                if (count > 0) { btn.innerText = `Generating Route (${count}s)`; } 
                else {
                    clearInterval(interval);
                    btn.disabled = false;
                    btn.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded text-sm uppercase transition cursor-pointer";
                    btn.innerText = "🚀 Direct Download Now";
                    btn.onclick = () => window.location.href = car.downloadUrl;
                }
            }, 1000);
        }

        initSite();
    </script>
</body>
</html>
