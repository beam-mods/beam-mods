        .about-copy h1 { font-size: clamp(34px, 5vw, 48px); line-height: 1.05; letter-spacing: -.02em; margin: 0; }
        .about-note { border-top: 2px solid #f0782b; color: #b4bfcc !important; padding: 14px 18px 0; }

<body>

            <a href="?">BEAM<span>DEX</span></a>
            <div class="header-nav">
                <a href="?">HOME</a>
                <a href="?page=about">ABOUT</a>
            </div>
        </div>
    </header>

    <main>
        <div class="ad-top">

<!-- BEGIN AADS AD UNIT 2454198 -->

<div id="frame" style="width: 100%;margin: auto;position: relative; z-index: 99998;">
      <iframe data-aa='2454198' src='//acceptable.a-ads.com/2454198/?size=Adaptive'
                style='border:0; padding:0; width:70%; height:auto; overflow:hidden;display: block;margin: auto'></iframe>
        </div>

<!-- END AADS AD UNIT 2454198 -->        </div>

        <div id="pageContent" class="loading-screen">Loading repository content...</div>
    </main>
    <footer class="site-footer">
        <strong>Beamdex does not host mod files.</strong><br>
        Links lead to external websites and third-party services. We are not responsible for the security of external links.
    </footer>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const activeSlug = urlParams.get('mod');
        const isAboutPage = urlParams.get('page') === 'about';

        async function runSite() {
            try {
                const res = await fetch('cars.json');
                const database = await res.json();

                if (isAboutPage) {
                    showAboutPage();
                } else if (activeSlug) {
                    const match = database.find(item => item.slug === activeSlug);
                    match ? showDownloadPage(match) : window.location.href = '?';
                } else {
                    showHomepage(database);
                }
            } catch (err) {
                document.getElementById('pageContent').innerHTML = "<p style='color: #ef4444; text-align: center;'>Database fetch failed.</p>";
            }
        }

        function showAboutPage() {
            document.title = 'About Beamdex';
            document.getElementById('pageContent').innerHTML = `
                <div class="about-layout">
                    <section class="about-copy">
                        <div class="heading-txt">Beamdex / About</div>
                        <h1>bbbbbb<br>ssssss</h1>
                        <p>placeholder</p>
                        <div class="about-note">placeholder22324234</div>
                    </section>
                </div>`;
        }

        function showHomepage(cars) {
            const types = [...new Set(cars.map(car => car.type || 'Other'))].sort();
            const developers = [...new Set(cars.map(car => car.developer || 'Unknown'))].sort();
            const typeLabels = { Car: 'Cars', Map: 'Maps' };
            const typeOptions = ['<option value="">All types</option>', ...types.map(type => `<option value="${type}">${typeLabels[type] || `${type}s`}</option>`)].join('');
            const developerOptions = ['<option value="">All developers</option>', ...developers.map(developer => `<option value="${developer}">${developer}</option>`)].join('');

            document.getElementById('pageContent').innerHTML = `
                <section class="index-intro">
                    <div>
                        <h1>Quality BeamNG mods...<br>but free.</h1>
                        <p>A growing collection of BeamNG mods, with patches for 0.39.</p>
                    </div>
                    <div class="index-stats">
                        <div class="stat"><strong>${cars.length}</strong><span>mods</span></div>
                    </div>
                </section>
                <section class="catalog-shell">
                    <div class="catalog-tools">
                        <input id="searchInput" class="filter-control" type="search" placeholder="Search cars, maps, developers..." aria-label="Search repository">
                        <select id="typeFilter" class="filter-control" aria-label="Filter by type">${typeOptions}</select>
                        <select id="developerFilter" class="filter-control" aria-label="Filter by developer">${developerOptions}</select>
                    </div>
                    <div id="resultsCount" class="results-count"></div>
                    <div id="resultsGrid" class="grid-home"></div>
                </section>`;

            const renderResults = () => {
                const search = document.getElementById('searchInput').value.trim().toLowerCase();
                const selectedType = document.getElementById('typeFilter').value;
                const selectedDeveloper = document.getElementById('developerFilter').value;
                const filteredCars = cars.filter(car => {
                    const searchable = `${car.name} ${car.type} ${car.developer}`.toLowerCase();
                    return searchable.includes(search)
                        && (!selectedType || (car.type || 'Other') === selectedType)
                        && (!selectedDeveloper || (car.developer || 'Unknown') === selectedDeveloper);
                });
                document.getElementById('resultsCount').textContent = `${filteredCars.length} mod${filteredCars.length === 1 ? '' : 's'}`;
                document.getElementById('resultsGrid').innerHTML = filteredCars.length
                    ? filteredCars.map(car => `
                        <a href="?mod=${encodeURIComponent(car.slug)}" class="card home-card">
                            <img src="${car.image}" class="card-thumb" alt="${car.name} preview">
                            <div class="card-meta">
                                <div>
                                    <span class="badge-cat">${car.type || 'Other'} · ${car.developer || 'Unknown'}</span>
                                    <h3 class="card-name">${car.name}</h3>
                                    <span class="card-description">${car.description || 'No description yet'}</span>
                                </div>
                            </div>
                        </a>`).join('')
                    : '<div class="empty-state">No matching content found.</div>';
            };

            ['searchInput', 'typeFilter', 'developerFilter'].forEach(id => {
                document.getElementById(id).addEventListener('input', renderResults);
                document.getElementById(id).addEventListener('change', renderResults);
            });
            renderResults();
        }

        function showDownloadPage(car) {
            document.title = `Download ${car.name}`;
            document.getElementById('pageContent').innerHTML = `
                <div class="grid-download">
                    <div class="card">
                        <div class="dl-header-row">
                            <span class="badge-cat">${car.type || 'Other'} · ${car.developer || 'Unknown'}</span>
                        </div>
                        <h1 class="card-name" style="font-size: 22px; margin-bottom: 16px;">${car.name}</h1>
                        <span class="card-description">${car.description || 'No description yet'}</span>
                        <img src="${car.image}" class="dl-main-img" alt="Main Showcase Grid Render">
                    </div>
                    
                    <div class="sidebar">
                        <div class="card btn-box">
                            <h3>File Security Check</h3>
                            <button id="timerBtn" disabled class="action-btn btn-wait">Preparing Route (5s)</button>
                        </div>
                    </div>
                </div>`;

            let timerSeconds = 5;
            const targetButton = document.getElementById('timerBtn');
            const countdownTracker = setInterval(() => {
                timerSeconds--;
                if (timerSeconds > 0) {
                    targetButton.innerText = `Preparing Route (${timerSeconds}s)`;
                } else {
                    clearInterval(countdownTracker);
                    targetButton.disabled = false;
                    targetButton.className = "action-btn btn-go";
                    targetButton.innerText = "Download mod";
                    targetButton.onclick = () => window.location.href = car.downloadUrl;
                }
            }, 1000);
        }

        runSite();
    </script>
